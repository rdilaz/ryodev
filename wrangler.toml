# RyoDev live hub: static phone app + tiny status API on Cloudflare Workers.
# Setup steps: docs/LIVE-SETUP.md. Secrets (never in this file):
#   npx wrangler secret put INGEST_TOKEN   # laptops use this to POST /api/events
#   npx wrangler secret put VIEW_TOKEN     # the phone uses this to GET /api/state

name = "ryodev"
main = "worker/index.mjs"
compatibility_date = "2026-09-01"

# Deploys to https://ryodev.<your-subdomain>.workers.dev
workers_dev = true

# Also serve it on ryo.is under /_/ (the ryo.is zone must be in this Cloudflare
# account). The secret code after /_/ is NOT in this file: it lives in the
# BASE_PATH secret (npx wrangler secret put BASE_PATH -> /_/yourcode).
# Everything else under /_/ answers 404; the rest of ryo.is is untouched.
routes = [
  { pattern = "ryo.is/_/*", zone_name = "ryo.is" },
]

# `npx wrangler deploy` rebuilds the allowlisted static app into ./dist first.
[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"
# Every request reaches the Worker first, so a BASE_PATH mount can hide the root
# and strip its prefix before looking up files.
run_worker_first = true

# One Durable Object instance ("hub") holds the latest state for all laptops.
[[durable_objects.bindings]]
name = "HUB"
class_name = "RyoDevHub"

# SQLite-backed Durable Objects are available on the Workers free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RyoDevHub"]


