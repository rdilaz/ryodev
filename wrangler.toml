# RyoDev live hub: static phone app + tiny status API on Cloudflare Workers.
# Setup steps: docs/LIVE-SETUP.md. Secrets (never in this file):
#   npx wrangler secret put INGEST_TOKEN   # laptops use this to POST /api/events
#   npx wrangler secret put VIEW_TOKEN     # the phone uses this to GET /api/state

name = "ryodev"
main = "worker/index.mjs"
compatibility_date = "2026-09-01"

# Deploys to https://ryodev.<your-subdomain>.workers.dev
workers_dev = true

# `npx wrangler deploy` rebuilds the allowlisted static app into ./dist first.
[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"
# /api and /api/* always reach the Worker, even if a static file with that path existed.
run_worker_first = ["/api", "/api/*"]

# One Durable Object instance ("hub") holds the latest state for all laptops.
[[durable_objects.bindings]]
name = "HUB"
class_name = "RyoDevHub"

# SQLite-backed Durable Objects are available on the Workers free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RyoDevHub"]

# Later, to serve from your own domain (already on Cloudflare), uncomment:
# routes = [
#   { pattern = "ryodev.example.com", custom_domain = true },
# ]
