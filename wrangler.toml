# RyoDev live hub: static phone app + tiny status API on Cloudflare Workers.
# Setup steps: docs/LIVE-SETUP.md. Secrets (never in this file):
#   npx wrangler secret put INGEST_TOKEN   # hooks use this to POST /api/events
#   npx wrangler secret put VIEW_TOKEN     # the phone uses this to GET /api/state

name = "ryodev"
main = "worker/index.mjs"
compatibility_date = "2026-09-01"

# Deploys to https://ryodev.<your-subdomain>.workers.dev
workers_dev = true

# This project deliberately ships without a custom-domain route. To use one,
# add your own Cloudflare route locally and, if mounting below a path, set the
# BASE_PATH secret (for example: /_/private-path). A non-obvious path is not
# access control; the INGEST_TOKEN and VIEW_TOKEN protect the API.

# `npx wrangler deploy` rebuilds the allowlisted static app into ./dist first.
[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"
# Every request reaches the Worker first, so a BASE_PATH mount can hide the root
# and strip its prefix before looking up files.
run_worker_first = true

# One Durable Object instance ("hub") holds the latest state for all machines.
[[durable_objects.bindings]]
name = "HUB"
class_name = "RyoDevHub"

# SQLite-backed Durable Objects are available on the Workers free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RyoDevHub"]


